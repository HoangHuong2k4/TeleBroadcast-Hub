<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0ea5e9" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Icon Group (140x140) -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#logoBgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4" filter="url(#logoGlow)" />

    <!-- Broadcast Waves -->
    <path d="M 95 35 A 50 50 0 0 1 120 60" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 85 45 A 35 35 0 0 1 105 65" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- Paper Plane -->
    <g transform="translate(-10, 0) scale(0.32)">
      <path d="M 120 260 L 330 140 L 175 315 L 165 385 L 215 335 L 295 380 L 375 120 Z" fill="#ffffff" filter="url(#logoGlow)" />
      <path d="M 330 140 L 175 315 L 215 335 Z" fill="#93c5fd" opacity="0.8" />
      <path d="M 175 315 L 165 385 L 215 335 Z" fill="#60a5fa" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="175" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#logoTextGrad)" letter-spacing="-0.5">
    TeleBroadcast
  </text>
  <text x="175" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    HUB • TELEGRAM AUTOMATION
  </text>
</svg>
